name: Symfony recipe maintenance

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - LICENSE
      - 'translations/**'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - LICENSE
      - 'translations/**'
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  update-recipes:
    name: Update Symfony recipes
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RECIPE_UPDATE_APP_ID }}
          private-key: ${{ secrets.RECIPE_UPDATE_APP_PRIVATE_KEY }}

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.head_ref || 'main' }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup devbox
        uses: jetify-com/devbox-install-action@v0.15.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: devbox run composer install --prefer-dist --no-progress --no-interaction

      - name: Update outdated Symfony recipes
        id: recipes
        run: |
          set -euo pipefail

          set +e
          recipes_output=$(devbox run composer recipes --outdated 2>&1)
          recipes_status=$?
          set -e

          printf '%s\n' "$recipes_output"

          if [ "$recipes_status" -eq 0 ]; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
            echo "failed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          packages=$(printf '%s\n' "$recipes_output" | awk '/^[[:space:]]*\* / && /\(update available\)/ { print $2 }')

          if [ -z "$packages" ]; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
            echo "failed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config user.email "${{ secrets.RECIPE_UPDATE_APP_ID }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            git checkout -B automated/symfony-recipe-updates
          fi

          initial_head=$(git rev-parse HEAD)
          update_failed=0

          for package in $packages; do
            echo "Updating Symfony recipe for $package"

            set +e
            devbox run composer recipes:update "$package" --no-interaction --no-changelog
            update_status=$?
            set -e

            if [ "$update_status" -ne 0 ] || [ -n "$(git diff --name-only --diff-filter=U)" ]; then
              echo "Recipe update for $package failed or produced conflicts. Resolve it manually."
              git status --short
              git reset --hard HEAD
              git clean -fd
              update_failed=1
              continue
            fi

            git add -A

            if git diff --cached --quiet; then
              echo "Recipe update for $package produced no changes."
              continue
            fi

            git commit -m "Update Symfony recipe for $package"
          done

          if [ "$update_failed" -ne 0 ]; then
            echo "failed=true" >> "$GITHUB_OUTPUT"
          else
            echo "failed=false" >> "$GITHUB_OUTPUT"
          fi

          if [ "$(git rev-parse HEAD)" = "$initial_head" ]; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "updated=true" >> "$GITHUB_OUTPUT"

      - name: Push recipe updates to pull request branch
        if: steps.recipes.outputs.updated == 'true' && github.event_name == 'pull_request'
        run: git push origin HEAD:${{ github.head_ref }}

      - name: Push recipe update branch
        if: steps.recipes.outputs.updated == 'true' && github.event_name != 'pull_request'
        run: git push --force-with-lease origin HEAD:automated/symfony-recipe-updates

      - name: Open or update pull request
        if: steps.recipes.outputs.updated == 'true' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          pr_number=$(gh pr list \
            --head automated/symfony-recipe-updates \
            --base main \
            --state open \
            --json number \
            --jq '.[0].number // empty')

          if [ -n "$pr_number" ]; then
            gh pr edit "$pr_number" \
              --title "Update Symfony recipes" \
              --body "Automated Symfony Flex recipe updates."
          else
            gh pr create \
              --head automated/symfony-recipe-updates \
              --base main \
              --title "Update Symfony recipes" \
              --body "Automated Symfony Flex recipe updates."
          fi

      - name: Fail when some recipes need manual resolution
        if: steps.recipes.outputs.failed == 'true'
        run: |
          echo "One or more recipe updates failed or produced conflicts."
          exit 1
