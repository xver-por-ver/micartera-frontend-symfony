name: Docker build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  docker-build:
    name: Docker build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Load Docker build arguments
        run: |
          set -a
          . ./versions.env
          set +a
          {
            echo "RELEASE_PHP=$RELEASE_PHP"
            echo "RELEASE_NODE=$RELEASE_NODE"
            echo "RELEASE_OPENTELEMETRY=$RELEASE_OPENTELEMETRY"
          } >> "$GITHUB_ENV"

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          build-args: |
            RELEASE_PHP=${{ env.RELEASE_PHP }}
            RELEASE_NODE=${{ env.RELEASE_NODE }}
            RELEASE_OPENTELEMETRY=${{ env.RELEASE_OPENTELEMETRY }}
          cache-from: type=gha,scope=docker-build
          cache-to: type=gha,scope=docker-build,mode=max
